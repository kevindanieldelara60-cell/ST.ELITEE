<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST.ELITE</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0b0b0b;
      color:white;
    }

    .app{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{
      font-size:40px;
      margin-bottom:5px;
    }

    p{
      color:#aaa;
    }

    .status{
      color:#00ff88;
      margin-bottom:10px;
    }

    .tabs{
      display:flex;
      gap:10px;
      margin:20px 0;
      flex-wrap:wrap;
    }

    .tab{
      background:#1b1b1b;
      border:none;
      color:white;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
    }

    .tab.active{
      background:#7c3aed;
    }

    .section{
      display:none;
      animation:fade .4s ease;
    }

    .section.active{
      display:block;
    }

    .card{
      background:#141414;
      border-radius:15px;
      padding:20px;
      margin-bottom:15px;
      border:1px solid #222;
    }

    .card h3{
      margin:0;
      font-size:24px;
    }

    .price{
      margin:10px 0;
      color:#00ff88;
      font-size:20px;
    }

    .buy{
      display:inline-block;
      padding:10px 20px;
      border-radius:10px;
      background:#7c3aed;
      color:white;
      text-decoration:none;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="status">● ONLINE 24/7</div>

  <h1>ST.ELITE</h1>

  <p>Más que una tienda</p>

  <div class="tabs">
    <button class="tab active" onclick="showTab('diamantes',this)">
      💎 Diamantes
    </button>

    <button class="tab" onclick="showTab('robux',this)">
      🎮 Robux
    </button>

    <button class="tab" onclick="showTab('instagram',this)">
      📷 Instagram
    </button>

    <button class="tab" onclick="showTab('wifi',this)">
      📶 Wifi
    </button>
  </div>

  <!-- DIAMANTES -->

  <div id="diamantes" class="section active">

    <div class="card">
      <h3>110 Diamantes</h3>
      <div class="price">$1600</div>
      <a class="buy" href="#">Comprar</a>
    </div>

    <div class="card">
      <h3>341 Diamantes</h3>
      <div class="price">$5400</div>
      <a class="buy" href="#">Comprar</a>
    </div>

    <div class="card">
      <h3>572 Diamantes</h3>
      <div class="price">$7500</div>
      <a class="buy" href="#">Comprar</a>
    </div>

  </div>

  <!-- ROBUX -->

  <div id="robux" class="section">

    <div class="card">
      <h3>100 Robux</h3>
      <div class="price">$1650</div>
      <a class="buy" href="#">Comprar</a>
    </div>

    <div class="card">
      <h3>200 Robux</h3>
      <div class="price">$3100</div>
      <a class="buy" href="#">Comprar</a>
    </div>

  </div>

  <!-- INSTAGRAM -->

  <div id="instagram" class="section">

    <div class="card">
      <h3>Seguidores Instagram</h3>
      <div class="price">Desde $1000</div>
      <a class="buy" href="#">Comprar</a>
    </div>

  </div>

  <!-- WIFI -->

  <div id="wifi" class="section">

    <div class="card">
      <h3>Wifi Premium</h3>
      <div class="price">$5000</div>
      <a class="buy" href="#">Comprar</a>
    </div>

  </div>

</div>

<script>
function showTab(id,btn){

  document.querySelectorAll('.section').forEach(section=>{
    section.classList.remove('active')
  })

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.classList.remove('active')
  })

  document.getElementById(id).classList.add('active')

  btn.classList.add('active')
}
</script>

</body>
</html>
